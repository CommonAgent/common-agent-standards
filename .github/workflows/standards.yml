# Checks every standard in this repository and renders the site of each one
# that has a builder.
#
# A pull request and a push to main check every standard: the registry against
# the specifications, the links in each standard's folder, and, for each
# standard with a builder (common-agent, messaging, naming, processes, rfp, sow and mandate), its site
# rendered at /draft/, the contrast gate over every page, and the links in the
# rendered pages. A tag <id>-v<version> (such as messaging-v0.9.0-draft) checks
# and renders that one standard at /<version>/ and at the root.
#
# Publishing runs when the repository variable DEPLOY_SITES is true, and only
# for a push to main (the /draft/ copies) or a tag (that standard's version and
# its root), never for a pull request or another branch. Each standard is
# uploaded to its own bucket only. The workflow signs in to Google Cloud through
# Workload Identity Federation, whose provider accepts a token from this
# repository only, and only for main or a tag; the service account may write
# the site buckets and clear the CDN of their load balancers, and nothing
# else.
#
# What the deployment is called stays out of this public repository and its
# public logs: the project, the provider, the service account, the buckets and
# the load balancers are repository secrets, which GitHub masks wherever they
# would be printed. Repository variables (Settings, Secrets and variables,
# Actions, Variables):
#   DEPLOY_SITES          true to publish
#   <ID>_HOSTS            for each standard with a builder other than
#                         common-agent, with <ID> its id in capitals (MESSAGING,
#                         NAMING, PROCESSES, RFP, SOW, MANDATE): the hosts to clear, separated by
#                         spaces
# Repository secrets:
#   GCP_PROJECT           the Google Cloud project that holds the sites
#   GCP_PROJECT_NUMBER    its number, masked because the provider's name holds it
#   GCP_WIF_PROVIDER      projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_DEPLOY_SA         the service account that may write the site buckets and clear the CDN
#   <ID>_BUCKET           gs://<bucket>
#   <ID>_URLMAP           the load balancer's URL map
# commonagent.net's bucket and load balancer are named in
# common-agent/site/deploy.sh. With DEPLOY_SITES unset, every run renders and
# checks the sites and uploads nothing.
#
# A tag is published again with this workflow, whatever the workflow was when
# the tag was made, by running it by hand on main with the input tag set (gh
# workflow run standards.yml --ref main -f tag=<tag>).
name: Standards

on:
  push:
    branches: [main]
    tags: ["*-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "A tag to check, render and publish again, such as naming-v0.10. Empty checks main."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

# One publish at a time, in order, so an older run never overwrites a newer one.
concurrency:
  group: standards-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    name: what to check
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The registry agrees with the specifications
        run: node tools/check-registry.mjs

      - name: Links between the files of the repository
        run: node tools/check-links.mjs

      - name: The standards to check, from standards.json
        id: plan
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          node -e '
            const reg = require("./standards.json");
            let list = reg.standards, mode = "draft";
            if (process.env.TAG) {
              mode = process.env.TAG;
              list = list.filter((s) => s.tag === mode);
              if (!list.length) { console.error(`no standard in standards.json is tagged ${mode}`); process.exit(1); }
            }
            const include = list.map((s) => ({ id: s.id, name: s.name, folder: s.folder,
              builder: s.builder ? "yes" : "no", var: s.id.toUpperCase().replace(/-/g, "_") }));
            console.log(`matrix=${JSON.stringify({ include })}`);
            console.log(`mode=${mode}`);
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  standard:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      PUBLISH: ${{ github.event_name != 'pull_request' && vars.DEPLOY_SITES == 'true' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    steps:
      - name: Mask the names derived from the secrets
        if: matrix.builder == 'yes' && env.PUBLISH == 'true'
        env:
          BUCKET: ${{ secrets[format('{0}_BUCKET', matrix.var)] }}
          NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
        run: |
          [ -z "$BUCKET" ] || echo "::add-mask::${BUCKET#gs://}"
          [ -z "$NUMBER" ] || echo "::add-mask::$NUMBER"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Links in ${{ matrix.folder }}/
        run: node tools/check-links.mjs "${{ matrix.folder }}" --external

      - name: Install the site tools
        if: matrix.builder == 'yes'
        working-directory: ${{ matrix.folder }}/site/tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        if: matrix.builder == 'yes' && env.PUBLISH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: matrix.builder == 'yes' && env.PUBLISH == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Render, check and (when switched on) publish the site
        if: matrix.builder == 'yes'
        env:
          KEEP: ${{ runner.temp }}/site
          PROJECT: ${{ secrets.GCP_PROJECT }}
          BUCKET: ${{ secrets[format('{0}_BUCKET', matrix.var)] }}
          URLMAP: ${{ secrets[format('{0}_URLMAP', matrix.var)] }}
          HOSTS: ${{ vars[format('{0}_HOSTS', matrix.var)] }}
        run: |
          DRY="--dry-run"
          [ "$PUBLISH" = "true" ] && DRY=""
          if [ "${{ matrix.id }}" = "common-agent" ]; then
            # commonagent.net's bucket and load balancer are named in the script.
            unset BUCKET URLMAP HOSTS
            common-agent/site/deploy.sh "$MODE" $DRY
          else
            tools/render-site.sh "${{ matrix.id }}" "$MODE" $DRY
          fi

      - name: Links in the rendered site
        if: matrix.builder == 'yes'
        run: node tools/check-links.mjs --site "${{ runner.temp }}/site"

      - name: Keep the rendered site
        if: matrix.builder == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.id }}-${{ needs.plan.outputs.mode }}
          path: ${{ runner.temp }}/site
          retention-days: 14
